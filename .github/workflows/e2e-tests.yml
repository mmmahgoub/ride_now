name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main, develop]

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password123
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        run: cd backend && npm install
      
      - name: Install frontend dependencies
        run: cd frontend && npm install
      
      - name: Install Cypress
        run: cd frontend && npm install --save-dev cypress
      
      - name: Start backend server
        run: cd backend && npm start &
        env:
          MONGODB_URI: mongodb://admin:password123@localhost:27017/taxi-booking-test?authSource=admin
          JWT_SECRET: test_secret
          NODE_ENV: test
      
      - name: Wait for backend
        run: |
          npx wait-on http://localhost:5000/health --timeout 60000
      
      - name: Build frontend
        run: cd frontend && npm run build
      
      - name: Start frontend
        run: cd frontend && npm run preview &
      
      - name: Wait for frontend
        run: |
          npx wait-on http://localhost:5173 --timeout 60000
      
      - name: Run Cypress tests
        run: cd frontend && npm run test:e2e || true
        env:
          CYPRESS_BASE_URL: http://localhost:5173
      
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 5
      
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 5

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password123
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install dependencies
        run: cd backend && npm install
      
      - name: Run integration tests
        run: cd backend && npm run test:integration || npm test
        env:
          MONGODB_URI: mongodb://admin:password123@localhost:27017/taxi-booking-test?authSource=admin
          JWT_SECRET: test_secret
          NODE_ENV: test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/coverage-final.json
          flags: integration-tests
