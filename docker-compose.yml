version: '3.9'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: taxi-booking-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - taxi-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: taxi-booking-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/taxi-booking?authSource=admin
      - NODE_ENV=production
      - JWT_SECRET=your_super_secret_jwt_key_change_this_in_production
      - JWT_EXPIRE=7d
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FRONTEND_URL=http://localhost:5173
      - DRIVER_APP_URL=http://localhost:5174
      - ADMIN_URL=http://localhost:5175
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taxi-network
    healthcheck:
      test: curl -f http://localhost:5000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (User App)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: taxi-booking-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - taxi-network
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}

  # Driver App
  driver-app:
    build:
      context: .
      dockerfile: driver-app/Dockerfile
    container_name: taxi-booking-driver-app
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - taxi-network
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}

  # Admin Dashboard
  admin-dashboard:
    build:
      context: .
      dockerfile: admin-dashboard/Dockerfile
    container_name: taxi-booking-admin-dashboard
    restart: unless-stopped
    ports:
      - "5175:5175"
    depends_on:
      - backend
    networks:
      - taxi-network
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  taxi-network:
    driver: bridge
